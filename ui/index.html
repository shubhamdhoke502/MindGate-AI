<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGate AI — Local RAG Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --border-color: #334155;
            --user-msg-bg: #0284c7;
            --bot-msg-bg: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar UI */
        .sidebar {
            width: 300px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .upload-zone {
            border: 2px dashed var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .upload-zone:hover {
            background-color: rgba(56, 189, 248, 0.1);
        }

        .file-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-item {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
            word-break: break-all;
        }

        .btn-flush {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-flush:hover {
            background: #dc2626;
        }

        /* Main Chat Window */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: white;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            border: 1px solid var(--border-color);
        }

        .citation-tag {
            display: inline-block;
            background: #0ea5e9;
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        /* Input Bar & Popup */
        .input-wrapper {
            padding: 20px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        .input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        .btn-send {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Memory Recall Popup */
        .at-popup {
            position: absolute;
            bottom: 75px;
            left: 20px;
            width: 300px;
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            display: none;
            flex-direction: column;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
        }

        .at-item {
            padding: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        .at-item:hover {
            background: var(--bg-color);
        }
    </style>
</head>
<body>

    <!-- Sidebar UI -->
    <div class="sidebar">
        <div class="brand-title">
            ⚡ MindGate AI
        </div>

        <div class="upload-zone" id="uploadZone">
            📁 Drag & Drop PDF here<br>
            <span style="font-size: 0.75rem; color: var(--muted-text);">or click to select</span>
            <input type="file" id="fileInput" accept=".pdf" style="display: none;">
        </div>

        <div style="font-weight: bold; font-size: 0.9rem;">Uploaded Documents</div>
        <div class="file-list" id="fileList"></div>

        <button class="btn-flush" onclick="flushMemory()">🧹 Flush RAM / VRAM</button>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-container">
        <div class="chat-header">
            <div><strong>Active Workspace:</strong> <span id="wsDisplay">default_session</span></div>
            <div style="font-size: 0.85rem; color: var(--muted-text);" id="statusIndicator">🟢 Engine Ready</div>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <!-- Input Wrapper & @ Command Popup -->
        <div class="input-wrapper">
            <div class="at-popup" id="atPopup">
                <div class="at-item" onclick="insertAtCommand('@memory.json')">🧠 @ Recall Memory Box</div>
            </div>

            <form class="input-form" id="chatForm">
                <input type="text" class="chat-input" id="userInput" placeholder="Ask anything about your document... (Use '@' for memory recall)" autocomplete="off">
                <button type="submit" class="btn-send">Send</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let activeWorkspace = "default_session";

        // Initial Load
        document.addEventListener("DOMContentLoaded", () => {
            initWorkspace();
            loadChatHistory();
            setupEventListeners();
        });

        async function initWorkspace() {
            const formData = new FormData();
            formData.append("workspace_id", activeWorkspace);
            await fetch(`${API_BASE}/workspace/init`, { method: "POST", body: formData });
        }

        async function loadChatHistory() {
            try {
                const res = await fetch(`${API_BASE}/chat/history?workspace_id=${activeWorkspace}`);
                const data = await res.json();
                if (data.history) {
                    data.history.forEach(msg => appendMessage(msg.role, msg.content, msg.citations));
                }
            } catch (err) {
                console.error("Failed to load chat history:", err);
            }
        }

        function setupEventListeners() {
            // Upload handlers
            const uploadZone = document.getElementById("uploadZone");
            const fileInput = document.getElementById("fileInput");

            uploadZone.addEventListener("click", () => fileInput.click());
            fileInput.addEventListener("change", (e) => handleFileUpload(e.target.files[0]));

            uploadZone.addEventListener("dragover", (e) => e.preventDefault());
            uploadZone.addEventListener("drop", (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleFileUpload(e.dataTransfer.files[0]);
            });

            // Chat input & @ trigger
            const userInput = document.getElementById("userInput");
            const atPopup = document.getElementById("atPopup");

            userInput.addEventListener("input", (e) => {
                if (e.target.value.endsWith("@")) {
                    atPopup.style.display = "flex";
                } else {
                    atPopup.style.display = "none";
                }
            });

            document.getElementById("chatForm").addEventListener("submit", handleChatSubmit);
        }

        async function handleFileUpload(file) {
            if (!file || !file.name.endsWith(".pdf")) return alert("Only PDF files allowed!");

            const status = document.getElementById("statusIndicator");
            status.innerText = "⏳ Ingesting PDF...";

            const formData = new FormData();
            formData.append("file", file);
            formData.append("workspace_id", activeWorkspace);

            try {
                const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
                const data = await res.json();
                if (data.status === "success") {
                    addFileToList(file.name);
                    status.innerText = "🟢 PDF Indexed";
                }
            } catch (err) {
                alert("Upload failed!");
                status.innerText = "🔴 Engine Error";
            }
        }

        function addFileToList(fileName) {
            const list = document.getElementById("fileList");
            const item = document.createElement("div");
            item.className = "file-item";
            item.innerText = `📄 ${fileName}`;
            list.appendChild(item);
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById("userInput");
            const query = input.value.trim();
            if (!query) return;

            appendMessage("user", query);
            input.value = "";
            document.getElementById("atPopup").style.display = "none";

            // Create Assistant Empty Message Bubble for SSE Streaming
            const botMsgDiv = appendMessage("assistant", "");

            try {
                const response = await fetch(`${API_BASE}/chat/stream`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query, workspace_id: activeWorkspace })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value);
                    botMsgDiv.innerText += chunk;
                    document.getElementById("chatBox").scrollTop = document.getElementById("chatBox").scrollHeight;
                }
            } catch (err) {
                botMsgDiv.innerText = "Error streaming response.";
            }
        }

        function appendMessage(role, text, citations = []) {
            const chatBox = document.getElementById("chatBox");
            const msg = document.createElement("div");
            msg.className = `message ${role}`;
            msg.innerText = text;

            if (citations && citations.length > 0) {
                citations.forEach(c => {
                    const tag = document.createElement("a");
                    tag.className = "citation-tag";
                    tag.innerText = `📍 Source: ${c.doc} | Page ${c.page}, Lines ${c.lines}`;
                    msg.appendChild(tag);
                });
            }

            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        function insertAtCommand(cmd) {
            const input = document.getElementById("userInput");
            input.value += cmd;
            document.getElementById("atPopup").style.display = "none";
            input.focus();
        }

        async function flushMemory() {
            await fetch(`${API_BASE}/system/flush`, { method: "POST" });
            alert("System RAM & VRAM flushed successfully!");
        }
    </script>
</body>
</html>
