<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGate AI — Workspace</title>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        /* Layout Panels */
        #left-chat-panel { width: 50%; display: flex; flex-direction: column; border-right: 1px solid #334155; }
        #right-pdf-panel { width: 50%; display: flex; flex-direction: column; background: #1e293b; position: relative; }

        /* Headers */
        .panel-header { padding: 12px 20px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .panel-header h2 { font-size: 16px; color: #38bdf8; font-weight: 600; }

        /* Chat History Box */
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .msg.assistant { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }

        /* Citation Badge */
        .citation-btn { display: inline-block; margin-top: 8px; background: #0ea5e9; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; text-decoration: none; border: none; font-weight: 600; }
        .citation-btn:hover { background: #38bdf8; }

        /* Input Controls */
        .input-bar { padding: 14px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; outline: none; }
        button { padding: 10px 18px; background: #0284c7; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0369a1; }

        /* PDF Viewer Container */
        #pdf-viewer-container { flex: 1; overflow: auto; position: relative; padding: 20px; display: flex; justify-content: center; }
        #canvas-wrapper { position: relative; display: inline-block; }
        canvas { border: 1px solid #475569; background: #ffffff; }

        /* Highlighting Box */
        .highlight-box { position: absolute; background: rgba(250, 204, 21, 0.4); border: 2px solid #eab308; pointer-events: none; transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>

    <!-- Left Panel: Chat Interface -->
    <div id="left-chat-panel">
        <div class="panel-header">
            <h2>MindGate AI — Engine Workspace</h2>
            <input type="file" id="pdf-uploader" accept=".pdf" style="display:none;" onchange="uploadPDF()">
            <button onclick="document.getElementById('pdf-uploader').click()">+ Upload PDF</button>
        </div>
        <div id="chat-messages"></div>
        <div class="input-bar">
            <input type="text" id="user-input" placeholder="Ask question or use @ to recall context..." onkeypress="if(event.key==='Enter') sendQuery()">
            <button onclick="sendQuery()">Send</button>
        </div>
    </div>

    <!-- Right Panel: Side-by-Side PDF Viewer -->
    <div id="right-pdf-panel">
        <div class="panel-header">
            <h2 id="pdf-title">PDF Document Viewer</h2>
            <span id="page-indicator" style="font-size:12px; color:#94a3b8;">No Document Loaded</span>
        </div>
        <div id="pdf-viewer-container">
            <div id="canvas-wrapper">
                <canvas id="pdf-canvas"></canvas>
                <div id="highlight-layer"></div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let activePdfName = "";
        let pdfDoc = null;
        let scale = 1.2;

        // Load Chat History on App Start
        window.onload = async () => {
            const res = await fetch('/api/history');
            const data = await res.json();
            if (data.history) {
                data.history.forEach(msg => appendMessage(msg.role, msg.content, msg.citations));
            }
        };

        function appendMessage(role, text, citations = []) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;

            if (citations && citations.length > 0) {
                citations.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = "citation-btn";
                    btn.innerText = `📄 ${c.file_name} | Page ${c.page} (Lines ${c.lines})`;
                    btn.onclick = () => renderPDFPage(c.file_name, c.page);
                    div.appendChild(document.createElement('br'));
                    div.appendChild(btn);
                });
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function uploadPDF() {
            const fileInput = document.getElementById('pdf-uploader');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.status === 'success') {
                activePdfName = data.file_name;
                alert(`Uploaded and Ingested: ${data.file_name}`);
                renderPDFPage(activePdfName, 1);
            }
        }

        async function sendQuery() {
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            appendMessage('user', query);
            input.value = '';

            const res = await fetch('/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query, active_pdf: activePdfName || null })
            });

            const data = await res.json();
            appendMessage('assistant', data.answer, data.citations);
        }

        async function renderPDFPage(fileName, pageNum) {
            activePdfName = fileName;
            document.getElementById('pdf-title').innerText = fileName;
            document.getElementById('page-indicator').innerText = `Page ${pageNum}`;

            const url = `/pdf_files/${fileName}`;
            if (!pdfDoc || pdfDoc._transport.filename !== url) {
                pdfDoc = await pdfjsLib.getDocument(url).promise;
            }

            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: scale });

            const canvas = document.getElementById('pdf-canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }
    </script>
</body>
</html>
