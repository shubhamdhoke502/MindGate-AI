<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindGate AI</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --sidebar-bg: #141414;
            --card-bg: #2a2a2a;
            --hover-bg: #333333;
            --text-main: #ececec;
            --text-muted: #a0a0a0;
            --accent-color: #3b82f6;
            --user-msg-bg: #2d3748;
            --ai-msg-bg: #1e1e1e;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
        }

        .btn-sidebar {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-sidebar:hover {
            background-color: var(--hover-bg);
        }

        .doc-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .doc-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-item:hover, .doc-item.active {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .doc-item.active {
            border-left: 3px solid var(--accent-color);
        }

        .flush-btn {
            background-color: #3f1818;
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flush-btn:hover {
            background-color: #5c1d1d;
        }

        /* Main Chat Area */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-dark);
        }

        .header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4ade80;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Message Styling */
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            position: relative;
        }

        .message-row.user {
            align-self: flex-end;
        }

        .message-row.ai {
            align-self: flex-start;
            max-width: 85%;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            position: relative;
        }

        .message-row.user .message-bubble {
            background-color: var(--user-msg-bg);
            color: var(--text-main);
            border-bottom-right-radius: 2px;
        }

        .message-row.ai .message-bubble {
            background-color: var(--ai-msg-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        /* Copy Buttons */
        .user-copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.4);
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 12px;
        }

        .message-row.user:hover .user-copy-btn {
            opacity: 1;
        }

        .ai-action-bar {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            padding-left: 4px;
        }

        .ai-copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .ai-copy-btn:hover, .user-copy-btn:hover {
            color: var(--text-main);
            background-color: var(--hover-bg);
        }

        /* Footer Input Box */
        .footer {
            padding: 16px 24px;
            background-color: var(--bg-dark);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-wrapper:focus-within {
            border-color: #555555;
        }

        .upload-icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon-btn:hover {
            color: var(--text-main);
            background-color: var(--hover-bg);
        }

        .chat-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            max-height: 180px;
            min-height: 24px;
            padding: 6px 0;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--text-main);
            color: var(--bg-dark);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Hidden File Input */
        #hiddenFileInput {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="btn-sidebar" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> New chat
        </button>

        <button class="btn-sidebar" onclick="triggerFileUpload()">
            <i class="fa-solid fa-folder-open"></i> Upload PDF Document
        </button>

        <div class="doc-list" id="docListContainer">
            <!-- Dynamic Document items will append here -->
        </div>

        <button class="flush-btn" onclick="flushMemory()">
            <i class="fa-solid fa-broom"></i> Flush RAM / VRAM
        </button>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="header">
            <i class="fa-solid fa-bars"></i>
            <span class="status-badge" id="indexingStatus">
                <i class="fa-solid fa-circle" style="font-size: 8px;"></i> <span id="statusText">PDF Indexed</span>
            </span>
        </div>

        <!-- Chat Container -->
        <div class="chat-box" id="chatBox">
            <!-- Messages append dynamically -->
        </div>

        <!-- Footer / Input Box -->
        <div class="footer">
            <div class="input-wrapper">
                <button class="upload-icon-btn" onclick="triggerFileUpload()" title="Upload Document">
                    <i class="fa-solid fa-plus"></i>
                </button>
                
                <textarea 
                    id="userPrompt" 
                    class="chat-textarea" 
                    placeholder="Ask MindGate AI... (Use '@' for memory)" 
                    rows="1"
                    oninput="autoResizeTextarea(this)"
                    onkeydown="handleKeyDown(event)"
                ></textarea>

                <button class="send-btn" onclick="sendMessage()">
                    <i class="fa-solid fa-arrow-up"></i>
                </button>
            </div>
            <input type="file" id="hiddenFileInput" accept=".pdf,.txt,.docx" onchange="uploadDocument(event)">
        </div>
    </div>

    <script>
        let activeDocument = null;
        let documentChatHistories = {}; // Document-wise chat history memory

        // Auto resize textarea as text grows
        function autoResizeTextarea(element) {
            element.style.height = 'auto';
            element.style.height = Math.min(element.scrollHeight, 180) + 'px';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function triggerFileUpload() {
            document.getElementById('hiddenFileInput').click();
        }

        // Upload PDF Document
        async function uploadDocument(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('statusText').innerText = "Indexing Document...";
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                document.getElementById('statusText').innerText = "PDF Indexed";
                
                // Add to sidebar
                addDocumentToSidebar(file.name);
            } catch (err) {
                console.error("Upload error:", err);
                document.getElementById('statusText').innerText = "Upload Failed";
            }
        }

        function addDocumentToSidebar(filename) {
            if (!documentChatHistories[filename]) {
                documentChatHistories[filename] = [];
            }

            const docList = id('docListContainer');
            
            // Check if item exists
            let existing = Array.from(docList.children).find(el => el.dataset.filename === filename);
            if (!existing) {
                const item = document.createElement('div');
                item.className = 'doc-item';
                item.dataset.filename = filename;
                item.innerHTML = `<i class="fa-regular fa-file-pdf"></i> <span>${filename}</span>`;
                item.onclick = () => selectDocument(filename, item);
                docList.appendChild(item);
                selectDocument(filename, item);
            }
        }

        function selectDocument(filename, element) {
            activeDocument = filename;
            
            // Highlight sidebar item
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            // Load Chat History for selected Document
            renderChatHistory(filename);
        }

        function startNewChat() {
            activeDocument = null;
            document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
            id('chatBox').innerHTML = '';
        }

        function renderChatHistory(filename) {
            const chatBox = id('chatBox');
            chatBox.innerHTML = '';

            const history = documentChatHistories[filename] || [];
            history.forEach(msg => {
                appendMessageToUI(msg.role, msg.text, false);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function copyToClipboard(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const origHTML = btnElement.innerHTML;
                btnElement.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                setTimeout(() => {
                    btnElement.innerHTML = origHTML;
                }, 1800);
            });
        }

        function appendMessageToUI(role, text, saveHistory = true) {
            const chatBox = id('chatBox');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            if (role === 'user') {
                row.innerHTML = `
                    <div class="message-bubble">${escapeHtml(text)}</div>
                    <button class="user-copy-btn" onclick="copyToClipboard('${escapeJs(text)}', this)">
                        <i class="fa-regular fa-copy"></i> Copy
                    </button>
                `;
            } else {
                row.innerHTML = `
                    <div class="message-bubble">${escapeHtml(text)}</div>
                    <div class="ai-action-bar">
                        <button class="ai-copy-btn" onclick="copyToClipboard('${escapeJs(text)}', this)">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                `;
            }

            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (saveHistory && activeDocument) {
                if (!documentChatHistories[activeDocument]) {
                    documentChatHistories[activeDocument] = [];
                }
                documentChatHistories[activeDocument].push({ role, text });
            }

            return row;
        }

        async function sendMessage() {
            const promptInput = id('userPrompt');
            const text = promptInput.value.trim();
            if (!text) return;

            // Render User Message
            appendMessageToUI('user', text, true);
            
            // Reset Input height
            promptInput.value = '';
            promptInput.style.height = 'auto';

            // Prepare AI Message Container
            const aiRow = appendMessageToUI('ai', '', false);
            const bubbleDiv = aiRow.querySelector('.message-bubble');
            const aiCopyBtn = aiRow.querySelector('.ai-copy-btn');

            let fullAiResponse = "";

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: text,
                        active_doc: activeDocument
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // Keep partial line

                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.replace('data: ', '').trim();
                            try {
                                const parsed = JSON.parse(jsonStr);
                                if (parsed.token) {
                                    fullAiResponse += parsed.token;
                                    bubbleDiv.innerText = fullAiResponse;
                                    id('chatBox').scrollTop = id('chatBox').scrollHeight;
                                }
                            } catch (e) {
                                // Ignore non-json boundary lines
                            }
                        }
                    }
                }

                // Update copy handler with complete AI text
                aiCopyBtn.onclick = function() { copyToClipboard(fullAiResponse, this); };

                if (activeDocument) {
                    documentChatHistories[activeDocument].push({ role: 'ai', text: fullAiResponse });
                }

            } catch (err) {
                bubbleDiv.innerText = "Error streaming response.";
                console.error("Streaming error:", err);
            }
        }

        async function flushMemory() {
            try {
                await fetch('/flush_memory', { method: 'POST' });
                alert("RAM / VRAM Flushed successfully.");
            } catch(e) {
                console.error(e);
            }
        }

        function id(elementId) { return document.getElementById(elementId); }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeJs(str) {
            return str.replace(/'/g, "\\'").replace(/\n/g, "\\n");
        }
    </script>
</body>
</html>
